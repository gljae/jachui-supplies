<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS는 apple-touch-icon에 PNG만 받는다. SVG는 무시하고 화면 캡처를 대신 쓴다 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- viewport-fit=cover라야 safe-area-inset이 실제 값을 갖는다.
         홈 화면에서 실행하면 상단 노치와 하단 홈 인디케이터가 화면에 걸린다 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="자취 생활용품 구매 기록과 소진 주기를 관리해요." />

    <!-- iOS 홈 화면 실행 시 사파리 UI를 감춘다 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="생활용품" />

    <title>자취 생활용품</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
